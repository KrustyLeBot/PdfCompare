name: Build exe

on:
  push:
    branches: [main]
    paths:
      - PdfCompare.py
      - icon.ico
      - .github/workflows/build-exe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pymupdf pillow numpy tkinterdnd2 pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PdfCompare --icon icon.ico --add-data "icon.ico;."
          --collect-all tkinterdnd2 --distpath dist PdfCompare.py

      - name: Publish a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/PdfCompare.exe \
            --target "$GITHUB_SHA" \
            --title "PdfCompare build ${{ github.run_number }}" \
            --generate-notes

