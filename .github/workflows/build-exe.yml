name: Build exe

on:
  push:
    branches: [main]
    paths:
      - PdfCompare.py
      - icon.ico
      - .github/workflows/build-exe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pymupdf pillow numpy tkinterdnd2 pyinstaller

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PdfCompare --icon icon.ico --add-data "icon.ico;."
          --collect-all tkinterdnd2 --distpath dist PdfCompare.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfCompare
          path: dist/PdfCompare.exe

      - name: Publish a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/PdfCompare.exe \
            --target "$GITHUB_SHA" \
            --title "PdfCompare build ${{ github.run_number }}" \
            --generate-notes

      # The README download link points at dist/PdfCompare.exe on main.
      # A push made with GITHUB_TOKEN does not trigger workflows, so no loop.
      - name: Commit the exe to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898798+github-actions[bot]@users.noreply.github.com"
          git add dist/PdfCompare.exe
          if git diff --cached --quiet; then
            echo "exe unchanged"
            exit 0
          fi
          git commit -m "Rebuild PdfCompare.exe for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
